name: defenderai

services:
  # ============================================================
  # 1. PostgreSQL Database
  # ============================================================
  postgres:
    image: postgres:16-alpine
    container_name: defenderai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-defenderai_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-1234}
      POSTGRES_DB: ${POSTGRES_DB:-defenderai}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-defenderai_user} -d ${POSTGRES_DB:-defenderai}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - defenderai-network

  # ============================================================
  # 2. DefenderAI Core Backend (FastAPI, Semgrep, Trivy)
  # ============================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: defenderai-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-defenderai_user}:${POSTGRES_PASSWORD:-1234}@postgres:5432/${POSTGRES_DB:-defenderai}
      EXECUTION_MODE: ${EXECUTION_MODE:-local}
      APP_ENV: ${APP_ENV:-production}
      SECRET_KEY: ${SECRET_KEY:-defenderai-super-secret-key-change-in-production-12345}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5-coder:7b}
      AI_PROVIDER: ${AI_PROVIDER:-ollama}
      SEMGREP_PATH: /usr/local/bin/semgrep
      TRIVY_PATH: /usr/local/bin/trivy
      SCAN_TIMEOUT_SECONDS: 300
      MAX_UPLOAD_SIZE_BYTES: 104857600
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - scan_workspaces:/app/scan-workspaces
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - defenderai-network

  # ============================================================
  # 3. DefenderAI Frontend Dashboard (Next.js 16)
  # ============================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: defenderai-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - defenderai-network

volumes:
  postgres_data:
    name: defenderai-postgres-data
  scan_workspaces:
    name: defenderai-scan-workspaces

networks:
  defenderai-network:
    name: defenderai-net
    driver: bridge
